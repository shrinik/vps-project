# Global configuration
global:
  # scrape_interval is set to the global default (1 minute).
  # evaluation_interval is set to the global default (1 minute)
  # scrape_timeout is set to the global default (10s).

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]  # Prometheus is running on localhost:9090

  # Scrape Loki metrics
  - job_name: "loki"
    metrics_path: "/metrics"  # Loki's metrics endpoint
    static_configs:
      - targets: ["loki:3100"]  # Loki's address and port

  # Scrape nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Scrape host system metrics
  - job_name: node
    metrics_path: "/metrics"  # Node Exporter's metrics endpoint
    static_configs:
    - targets: ['172.17.0.1:9100']