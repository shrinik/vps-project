services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Production config
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./my-blog/public:/usr/share/nginx/html
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - monitoring
    restart: on-failure:5

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    ports:
      - "9113:9113"
    command:
      - --nginx.scrape-uri=http://nginx:81/nginx_status
    depends_on:
      - nginx
    networks:
      - monitoring

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
    command:
      - -config.file=/etc/loki/loki-config.yaml
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus      
    depends_on:
      - nginx-exporter
      - loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      # Mount the named volume "grafana-storage" to the internal data directory
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring
    environment:
      # Optional: Set the admin password on initial startup
      - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false

# Define the network
networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
