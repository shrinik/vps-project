# Default server - must be first or have default_server flag
server {
    listen 80 default_server;
    server_name localhost;

    # Cache static assets (long expiration)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }    

    # Don't cache HTML files (they change frequently)
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=0, must-revalidate, proxy-revalidate";
    }    

    # Main location for all other requests
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html $uri/ =404;
    }
}

server {
    # Listen on an internal port (e.g., 81), accessible only within the Docker network
    listen 81;

    location /nginx_status {
        stub_status;
        access_log off;
    }
}



server {
    listen 80;
    server_name grafana.localhost;

    # Common proxy headers for all locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;

    # WebSocket endpoint for Grafana Live
    location /api/live/ws {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Longer timeouts for WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache static assets served by Grafana
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://grafana:3000;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Don't cache HTML and JSON responses
    location ~* \.(html|json)$ {
        proxy_pass http://grafana:3000;
        add_header Cache-Control "public, max-age=0, must-revalidate, proxy-revalidate";
    }

    location / {
        proxy_pass http://grafana:3000; # Forward to Grafana running on port 3000
        add_header Cache-Control "no-cache";
    }
}
