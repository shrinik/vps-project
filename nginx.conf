server {
    listen 80;
    server_name skudva.com www.skudva.com;

    # Allow certbot to verify domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all OTHER requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Listen on an internal port (e.g., 81), accessible only within the Docker network
    listen 81;

    location /nginx_status {
        stub_status;
        access_log off;
    }
}

server {
    listen 443 ssl http2;
    server_name skudva.com www.skudva.com;

    # SSL certificate paths (inside container)
    ssl_certificate /etc/letsencrypt/live/skudva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skudva.com/privkey.pem;

    # SSL configuration for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Your site configuration
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name grafana.skudva.com www.grafana.skudva.com;

    # Allow certbot to verify subdomain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443;
    server_name grafana.skudva.com www.grafana.skudva.com;

    # SSL certificate paths (inside container)
    ssl_certificate /etc/letsencrypt/live/grafana.skudva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.skudva.com/privkey.pem;

    # SSL configuration for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    location / {
        proxy_pass http://grafana:3000; # Forward to Grafana running on port 3000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;        
    }
}
